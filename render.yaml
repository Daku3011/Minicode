# Render Infrastructure-as-Code Blueprint
# Deploy: Connect repo to Render, it auto-detects this file

# ================================
# Persistent Data Stores
# ================================
databases:
  - name: minicode-db
    databaseName: minicode
    user: minicode_admin
    plan: free # Change to 'starter' for production persistence
    region: oregon

redis:
  - name: minicode-redis
    plan: free
    region: oregon
    ipAllowList: [] # Allow internal access from all services in this blueprint

services:
  # ================================
  # Backend API (FastAPI + Gunicorn)
  # ================================
  - type: web
    name: minicode-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    branch: main
    preDeployCommand: "CREATE_TABLES=1 python main.py"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minicode-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: minicode-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: minicode-redis
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set to your frontend URL, e.g. https://minicode-web.onrender.com
      - key: WEB_CONCURRENCY
        value: "4"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ================================
  # Celery Worker (Background Tasks)
  # ================================
  - type: worker
    name: minicode-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "celery -A worker.celery_app worker --loglevel=info"
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minicode-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: minicode-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: minicode-redis
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ================================
  # Frontend (Next.js)
  # ================================
  - type: web
    name: minicode-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to your minicode-api URL
      - key: NEXT_PUBLIC_GITHUB_CLIENT_ID
        sync: false
